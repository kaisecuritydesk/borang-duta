<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Borang Pinjaman Wang — Duta Security</title>
<meta name="robots" content="noindex,nofollow">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f2f3f5;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#111}
  .wrap{max-width:460px;margin:0 auto;padding:18px 14px 40px}
  .card{background:#fff;border-radius:18px;padding:22px 18px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  h1{margin:0;font-size:21px}
  .sub{margin:2px 0 18px;color:#666;font-size:14px}
  label{display:block;font-size:14px;color:#444;margin:14px 0 5px}
  input,textarea,select{width:100%;font:inherit;padding:12px;border:1px solid #c9ccd2;border-radius:12px;background:#fff}
  select{appearance:auto}
  input:focus,textarea:focus,select:focus{outline:none;border-color:#1a1a1a}
  textarea{resize:vertical;min-height:64px}
  .row{display:flex;gap:8px}
  .row input{flex:1}
  button{font:inherit;border:0;border-radius:12px;padding:12px 16px;cursor:pointer}
  .btn{background:#1a1a1a;color:#fff;width:100%;font-weight:600;margin-top:18px;padding:14px}
  .btn:disabled{opacity:.5}
  .sec{background:#eceef1;color:#1a1a1a}
  .who{margin-top:10px;padding:12px;border-radius:12px;background:#eaf6ef;color:#145c34;font-size:15px;display:none}
  .left{margin-top:8px;font-size:14px;color:#1a1a1a;background:#fff7e6;border:1px solid #f3d38a;border-radius:12px;padding:10px 12px;display:none}
  .err{color:#b42318;font-size:14px;margin-top:8px;display:none}
  .sig{border:1.5px dashed #9aa0a8;border-radius:12px;background:#fff;touch-action:none;width:100%;height:170px;display:block}
  .sigbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#666;margin-top:6px}
  .consent{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:14px;color:#333}
  .consent input{width:22px;height:22px;flex:none;margin-top:1px}
  .hide{display:none}
  .done{text-align:center;padding:30px 10px}
  .done .ref{font-size:24px;font-weight:700;margin:10px 0}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="formCard">
  <h1>Borang Pinjaman Wang</h1>
  <p class="sub">Duta Security Sdn Bhd</p>

  <label for="ic">No. kad pengenalan</label>
  <div class="row"><input id="ic" inputmode="numeric" autocomplete="off" placeholder="900101-14-5521" maxlength="14"><button class="sec" id="checkBtn" type="button">Semak</button></div>
  <div class="who" id="who"></div>
  <div class="left" id="leftInfo"></div>
  <div class="err" id="icErr"></div>

  <div id="rest" class="hide">
    <label for="amount">Jumlah pinjaman (RM)</label>
    <input id="amount" inputmode="decimal" placeholder="300.00">
    <label for="purpose">Tujuan pinjaman</label>
    <textarea id="purpose" maxlength="200" placeholder="Contoh: bayar sewa bilik"></textarea>
    <label for="bank">Bank (akaun anda sendiri)</label>
    <select id="bank"><option value="">— Pilih bank —</option><option>Maybank</option><option>CIMB Bank</option><option>Public Bank</option><option>RHB Bank</option><option>Hong Leong Bank</option><option>AmBank</option><option>Bank Islam</option><option>Bank Rakyat</option><option>BSN</option><option>Affin Bank</option><option>Alliance Bank</option><option>Agrobank</option><option>Bank Muamalat</option><option>UOB</option><option>OCBC</option><option>HSBC</option><option>Standard Chartered</option><option>MBSB Bank</option><option>Al Rajhi Bank</option><option>GXBank</option><option>Boost Bank</option><option>AEON Bank</option></select>
    <label for="acct">No. akaun bank</label>
    <input id="acct" inputmode="numeric" autocomplete="off" maxlength="24" placeholder="Contoh: 114012345678">
    <label for="acct2">Ulang no. akaun bank</label>
    <input id="acct2" inputmode="numeric" autocomplete="off" maxlength="24" placeholder="Taip sekali lagi">
    <label>Tandatangan (guna jari)</label>
    <canvas class="sig" id="sig"></canvas>
    <div class="sigbar"><span>Tandatangan di dalam kotak</span><button class="sec" id="clearSig" type="button" style="padding:6px 12px">Padam</button></div>
    <label class="consent"><input type="checkbox" id="consent"><span>Saya bersetuju syarikat memotong jumlah ini sepenuhnya dari gaji (7hb) atau OT (20hb) saya yang berikutnya, sebelum bayaran dibuat.</span></label>
    <div class="err" id="formErr"></div>
    <button class="btn" id="sendBtn" type="button">Hantar</button>
  </div>
</div>
<div class="card done hide" id="doneCard">
  <h1>Permohonan diterima</h1>
  <div class="ref" id="doneRef"></div>
  <p id="doneMsg" style="color:#444;margin:0"></p>
  <p style="color:#666;font-size:14px;margin-top:14px">Simpan nombor rujukan ini. Pejabat akan menghubungi anda selepas keputusan dibuat.</p>
</div></div>

<script>
  // Talks to the Duta Apps Script in the background, without any Google login.
  var API = 'https://script.google.com/macros/s/AKfycbxjvrUWOrwal0mtHQY9A8cDhXgFzOcO7lkzI2y0VMc5s8QjriGjHOHA00h5P-RxBaY3ig/exec';
  function call(action, data) {
    var body = { action: action }; for (var k in data) body[k] = data[k];
    return fetch(API, { method: 'POST', credentials: 'omit', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); });
  }
  var google = { script: { get run() {
    var ok = function () {}, fail = function () {};
    var o = {
      withSuccessHandler: function (f) { ok = f; return o; },
      withFailureHandler: function (f) { fail = f; return o; },
      checkIC: function (ic) { call('checkIC', { ic: ic }).then(ok, fail); },
      submitAdvance: function (p) { call('submitAdvance', { payload: p }).then(ok, fail); }
    };
    return o;
  } } };
</script>
<script>
  var $ = function (id) { return document.getElementById(id); };
  var verifiedIC = '', drawn = false, leftAmt = 0;

  function showErr(el, msg) { el.textContent = msg; el.style.display = msg ? 'block' : 'none'; }

  $('ic').addEventListener('input', function () {
    var d = this.value.replace(/\D/g, '').slice(0, 12), f = d;
    if (d.length > 6) f = d.slice(0, 6) + '-' + d.slice(6);
    if (d.length > 8) f = d.slice(0, 6) + '-' + d.slice(6, 8) + '-' + d.slice(8);
    this.value = f;
    if (verifiedIC && verifiedIC !== d) { verifiedIC = ''; $('who').style.display = 'none'; $('leftInfo').style.display = 'none'; $('rest').classList.add('hide'); }
    showErr($('icErr'), '');
  });

  $('checkBtn').addEventListener('click', function () {
    var d = $('ic').value.replace(/\D/g, '');
    if (d.length !== 12) { showErr($('icErr'), 'No. kad pengenalan mesti 12 digit.'); return; }
    var btn = this; btn.disabled = true; btn.textContent = '...';
    google.script.run.withSuccessHandler(function (r) {
      btn.disabled = false; btn.textContent = 'Semak';
      if (!r.ok) { showErr($('icErr'), r.msg); return; }
      verifiedIC = d; leftAmt = Number(r.left || 0);
      $('who').textContent = '✓ ' + r.name + (r.phone ? '  ·  Tel ' + r.phone : '');
      $('leftInfo').textContent = leftAmt > 0 ? 'Baki boleh dimohon bulan ini: RM' + leftAmt.toFixed(2) + ' (had RM' + r.limit + ' sebulan: RM500 sebelum gaji + RM500 sebelum OT; maksimum RM500 setiap permohonan)' : 'Had pinjaman RM' + r.limit + ' sebulan sudah penuh. Sila mohon bulan depan.';
      $('leftInfo').style.display = 'block';
      $('who').style.display = 'block';
      if (leftAmt <= 0) { $('rest').classList.add('hide'); return; }
      $('who').style.display = 'block';
      $('rest').classList.remove('hide');
      sizeCanvas();
    }).withFailureHandler(function () {
      btn.disabled = false; btn.textContent = 'Semak';
      showErr($('icErr'), 'Talian bermasalah. Sila cuba lagi.');
    }).checkIC(d);
  });

  var cv = $('sig'), ctx = cv.getContext('2d'), drawing = false;
  function sizeCanvas() {
    var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, r.width, r.height);
    ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
    drawn = false;
  }
  function pt(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  cv.addEventListener('pointerdown', function (e) { drawing = true; cv.setPointerCapture(e.pointerId); var p = pt(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
  cv.addEventListener('pointermove', function (e) { if (!drawing) return; var p = pt(e); ctx.lineTo(p.x, p.y); ctx.stroke(); drawn = true; });
  cv.addEventListener('pointerup', function () { drawing = false; });
  cv.addEventListener('pointercancel', function () { drawing = false; });
  $('clearSig').addEventListener('click', sizeCanvas);

  $('sendBtn').addEventListener('click', function () {
    var amt = $('amount').value.replace(/,/g, '').trim(), purpose = $('purpose').value.trim();
    if (!verifiedIC) return showErr($('formErr'), 'Sila semak No. kad pengenalan dahulu.');
    if (!/^\d+(\.\d{1,2})?$/.test(amt) || Number(amt) <= 0) return showErr($('formErr'), 'Masukkan jumlah pinjaman yang betul.');
    if (Number(amt) > leftAmt + 0.0001) return showErr($('formErr'), 'Jumlah melebihi baki bulan ini (RM' + leftAmt.toFixed(2) + ').');
    if (Number(amt) > 500) return showErr($('formErr'), 'Maksimum RM500 setiap permohonan (sebelum gaji atau sebelum OT).');
    if (purpose.length < 3) return showErr($('formErr'), 'Nyatakan tujuan pinjaman.');
    var bank = $('bank').value, acct = $('acct').value.replace(/\D/g, ''), acct2 = $('acct2').value.replace(/\D/g, '');
    if (!bank) return showErr($('formErr'), 'Pilih bank anda.');
    if (acct.length < 6 || acct.length > 20) return showErr($('formErr'), 'No. akaun bank tidak sah.');
    if (acct !== acct2) return showErr($('formErr'), 'No. akaun bank tidak sama. Sila semak semula.');
    if (!drawn) return showErr($('formErr'), 'Sila tandatangan dengan jari.');
    if (!$('consent').checked) return showErr($('formErr'), 'Sila tandakan persetujuan potongan gaji.');
    showErr($('formErr'), '');
    var btn = this; btn.disabled = true; btn.textContent = 'Menghantar...';
    google.script.run.withSuccessHandler(function (r) {
      if (!r.ok) { btn.disabled = false; btn.textContent = 'Hantar'; showErr($('formErr'), r.msg); return; }
      $('formCard').classList.add('hide'); $('doneCard').classList.remove('hide');
      $('doneRef').textContent = r.ref;
      $('doneMsg').textContent = r.name + ' · RM' + r.amount;
    }).withFailureHandler(function () {
      btn.disabled = false; btn.textContent = 'Hantar';
      showErr($('formErr'), 'Talian bermasalah. Permohonan belum dihantar. Sila cuba lagi.');
    }).submitAdvance({ ic: verifiedIC, amount: amt, purpose: purpose, signature: cv.toDataURL('image/png'), consent: $('consent').checked, bank: bank, account: acct, account2: acct2 });
  });
</script>
</body>
</html>
